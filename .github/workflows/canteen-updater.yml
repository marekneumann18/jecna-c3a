name: Update iCanteen Menu & Images

on:
  schedule:
    # Run at 05:00 UTC (06:00 CET) every Monday through Friday
    - cron: '0 5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch iCanteen Menu and Match Dish Images
        run: |
          python3 canteen_service.py --fetch

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add canteen_menu.json static/canteen_menu.json
          git diff --staged --quiet || (git commit -m "chore(canteen): update iCanteen menu & dish photos [skip ci]" && git push)
